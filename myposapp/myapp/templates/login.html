{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% tailwind_css %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe POS Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
        }
        .btn-register {
            display: inline-block;
            padding: 6px 20px; /* ปรับขนาด padding ให้เล็กลง */
            background-color: #d4af37;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px; /* ปรับขนาด font ให้เล็กลง */
            transition: background-color 0.3s;
            text-align: center;
            text-decoration: none;
            width: auto;
        }
        .btn-register:hover {
            background-color: #c9a01b;
        }
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }
        .login-form {
            display: flex;
            justify-content: space-between;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 80%; /* ปรับความกว้างให้ครอบคลุม 80% ของหน้าจอ */
            max-width: 1600px; /* กำหนดความกว้างสูงสุด */
            min-height: 80vh; /* ปรับความสูงขั้นต่ำให้ครอบคลุม 80% ของความสูงหน้าจอ */
        }
        .login-left {
            flex: 1;
            background: url("{% static 'BG_login.png' %}") no-repeat center center;
            background-size: cover;
            position: relative;
        }
        .login-left::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }
        .login-left .logo {
            position: absolute;
            bottom: 50px;
            left: 50px;
            color: white;
            font-size: 36px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .login-right {
            flex: 1.5; /* ปรับขนาดส่วนขวาให้ใหญ่ขึ้น */
            padding: 40px 60px;
        }
        .login-form h2 {
            font-size: 36px; /* ขนาดตัวอักษรใหญ่ขึ้น */
            font-weight: 600;
            margin-bottom: 20px;
            color: #7c6e6e;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #7c6e6e;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #7c6e6e;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 0;
            background-color: #d4af37;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #c9a01b;
        }
        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .remember-me input {
            margin-right: 10px;
        }
        .remember-me label {
            margin: 0;
            color: #7c6e6e;
        }
        .link {
            text-align: center;
            margin-top: 10px;
        }
        .link a {
            color: #7c6e6e;
            text-decoration: none;
            font-weight: 500;
        }
        .link a:hover {
            text-decoration: underline;
        }
        .register-link {
            text-align: right; /* จัดตำแหน่งปุ่มให้อยู่ชิดขวา */
            margin-top: 20px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-form">
        <div class="login-left">
        </div>
        <div class="login-right">
            <h2>Cafe POS</h2>
            <p class="text-center mb-8">Please enter your login information</p>
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>

                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>

                <button type="submit" class="btn">Login</button>
            </form>

            <div class="link">
                <a href="#">Forget Password?</a>
            </div>
            <div class="register-link">
                Don't Have an account?
                <a href="{% url 'register' %}" class="btn-register">Register</a>
            </div>

            {% if messages %}
            <ul class="mt-4">
                {% for message in messages %}
                <li class="text-red-500">{{ message }}</li>
                {% endfor %}
            </ul>
            {% endif %}
        </div>
    </div>
</div>
</body>
</html>
