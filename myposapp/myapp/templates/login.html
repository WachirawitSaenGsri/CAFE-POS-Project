{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% tailwind_css %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe POS Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="flex bg-white shadow-xl rounded-lg overflow-hidden w-full max-w-5xl min-h-[70vh]">
        <!-- Left Side (Image) -->
        <div class="hidden md:block w-1/2 bg-cover bg-center relative" style="background-image: url('{% static 'BG_login.png' %}');">
            <div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center">
            </div>
        </div>

        <!-- Right Side (Login Form) -->
        <div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center">
            <h2 class="text-3xl font-bold text-gray-800 text-center mb-4">Cafe POS</h2>
            <p class="text-center text-gray-600 mb-6">กรุณาป้อนข้อมูลเข้าสู่ระบบของคุณ</p>

            <form method="post" class="space-y-4">
                {% csrf_token %}

                <div>
                    <label for="username" class="block text-gray-700 font-medium">Username</label>
                    <input type="text" id="username" name="username" placeholder="Username" required
                        class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-yellow-500 focus:outline-none">
                </div>

                <div>
                    <label for="password" class="block text-gray-700 font-medium">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password" required
                        class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-yellow-500 focus:outline-none">
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input type="checkbox" id="remember" name="remember" class="h-4 w-4 text-yellow-500 border-gray-300 rounded">
                        <label for="remember" class="ml-2 text-gray-700">Remember me</label>
                    </div>
                    <a href="{% url 'password_reset' %}" class="text-yellow-500 hover:underline">ลืมรหัสผ่าน?</a>
                </div>

                <button type="submit" class="w-full bg-yellow-500 text-white p-3 rounded-lg hover:bg-yellow-600 transition shadow">เข้าสู่ระบบ</button>
            </form>

            <div class="mt-4 text-end">
                <span class="text-gray-700">ยังไม่มีบัญชี?</span>
                <a href="{% url 'register' %}" class="ml-2 bg-yellow-500 text-white px-4 py-2 rounded-lg shadow hover:bg-yellow-600">สมัครสมาชิก</a>
            </div>

            {% if messages %}
            <ul class="mt-2 text-start text-red-500">
                {% for message in messages %}
                <li>{{ message }}</li>
                {% endfor %}
            </ul>
            {% endif %}
        </div>
    </div>
</body>
</html>
