{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% tailwind_css %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAFE POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 font-kanit">

  <div class="container mx-auto p-8">
    <!-- Title Section -->
    <h1 class="text-3xl font-semibold text-gray-800 mb-6">แก้ไขส่วนผสมของโปรดักส์</h1>

    <!-- Product and Ingredient Details -->
    <div class="mb-6">
      <h2 class="text-xl font-medium text-gray-700">โปรดักส์: <span class="text-blue-600">{{ product_ingredient.product.product_name }}</span></h2>
      <h3 class="text-lg font-light text-gray-600">วัตถุดิบ: <span class="text-green-500">{{ product_ingredient.ingredient.name }}</span></h3>
    </div>

    <!-- Edit Product Ingredient Form -->
    <div class="bg-white p-8 rounded-lg shadow-lg border border-gray-200">
      <form method="POST">
        {% csrf_token %}
        
        <!-- Product Selection Dropdown -->
        <div class="mb-4">
          <label for="product" class="block text-sm font-medium text-gray-700">เลือกเมนู</label>
          <select name="product" id="product" class="w-full p-3 mt-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
            {% for product in products %}
              <option value="{{ product.id }}" {% if product.id == form.product.value %} selected {% endif %}>{{ product.product_name }}</option>
            {% endfor %}
          </select>
        </div>
        
        <!-- Ingredient Selection Dropdown -->
        <div class="mb-4">
          <label for="ingredient" class="block text-sm font-medium text-gray-700">เลือกวัตถุดิบ</label>
          <select name="ingredient" id="ingredient" class="w-full p-3 mt-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
            {% for ingredient in ingredients_list %}
              <option value="{{ ingredient.id }}" {% if ingredient.id == form.ingredient.value %} selected {% endif %}>{{ ingredient.name }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Quantity Field -->
        <div class="mb-4">
          <label for="quantity" class="block text-sm font-medium text-gray-700">ปริมาณ</label>
          <input type="number" name="quantity" id="quantity" value="{{ form.quantity.value }}" class="w-full p-3 mt-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50" min="0" step="any" required>
        </div>

        <!-- Submit Button -->
        <div class="flex justify-end">
          <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-6 rounded-lg shadow-md mt-4 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">บันทึกการแก้ไข</button>
        </div>
      </form>
    </div>

    <!-- Cancel Link -->
    <div class="mt-6">
      <a href="{% url 'manage_product_ingredients' product_ingredient.product.id %}" class="inline-block bg-gray-500 text-white py-2 px-4 rounded-lg hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-50">ยกเลิก</a>
    </div>
  </div>

</body>
</html>
