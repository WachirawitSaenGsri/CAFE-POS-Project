{#ิnavbar.html#}
{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="th">
<head>
    {% tailwind_css %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAFE POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100">

<!-- Navbar -->
<div class="bg-white shadow-md p-4 sm:p-6">
    <div class="container mx-auto flex flex-wrap justify-center items-center gap-4">
        <!-- Search Box -->
        <form action="{% url 'home_employee' %}" method="get" class="w-full sm:w-1/2 lg:w-1/3 flex bg-gray-100 border border-gray-300 rounded-lg shadow p-1">
            <input type="hidden" name="category" value="{{ category }}">
            <input type="text" name="q" value="{{ query }}" placeholder="ค้นหา..."
                   class="w-full border-none outline-none text-gray-600 px-2 text-sm py-2" required>
            <button type="submit"
                    class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 text-sm rounded-md transition">
                ค้นหา
            </button>
        </form>

        <!-- Time Display -->
        <div id="time-display" class="text-gray-600 font-medium hidden lg:block"></div>
        
    </div>
</div>

<script>
    function updateTime() {
        const now = new Date();
        const dateString = now.toLocaleDateString('th-TH', {
            weekday: 'long',
            day: '2-digit',
            month: 'long',
            year: 'numeric'
        });
        const timeString = now.toLocaleTimeString('th-TH', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });
        document.getElementById('time-display').textContent = `${dateString}, เวลา ${timeString}`;
    }
    updateTime();
    setInterval(updateTime, 1000);
</script>

</body>
</html>
