{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% tailwind_css %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter New Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }
        .reset-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .reset-form {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 40px 60px;
            text-align: center;
            width: 100%;
            max-width: 600px;
        }
        .reset-form h2 {
            font-size: 36px;
            font-weight: 600;
            color: #7c6e6e;
            margin-bottom: 20px;
        }
        .reset-form p {
            font-size: 18px;
            color: #7c6e6e;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            font-size: 16px;
            color: #7c6e6e;
            font-weight: 500;
            margin-bottom: 8px;
            display: block;
        }
        .form-group input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #7c6e6e;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 0;
            background-color: #d4af37;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
            text-align: center;
            text-decoration: none;
        }
        .btn:hover {
            background-color: #c9a01b;
        }
        .link {
            text-align: center;
            margin-top: 10px;
        }
        .link a {
            color: #7c6e6e;
            text-decoration: none;
            font-weight: 500;
        }
        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="reset-container">
    <div class="reset-form">
        <h2>กรุณากรอกรหัสผ่านใหม่</h2>
        <p>โปรดกรอกรหัสผ่านใหม่ของคุณด้านล่าง</p>

        <!-- Render the entire form using form.as_p to ensure fields appear correctly -->
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }} <!-- Rendering all fields in paragraph form -->

            <button type="submit" class="btn">รีเซ็ตรหัสผ่าน</button>
        </form>

        <div class="link">
            <a href="{% url 'login' %}">กลับไปยังหน้าเข้าสู่ระบบ</a>
        </div>
    </div>
</div>

</body>
</html>
