{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% tailwind_css %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รีเซ็ตรหัสผ่านใหม่</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white shadow-lg rounded-lg p-8 max-w-md w-full">
        <h2 class="text-3xl font-bold text-gray-800 text-center">กรุณากรอกรหัสผ่านใหม่</h2>
        <p class="text-gray-600 text-center mt-2 mb-6">โปรดกรอกรหัสผ่านใหม่ของคุณด้านล่าง</p>

        <!-- Form -->
        <form method="post" class="space-y-4">
            {% csrf_token %}
            
            <!-- ฟิลด์รหัสผ่านใหม่ -->
            <div>
                <label for="id_new_password1" class="block text-lg font-medium text-gray-700">รหัสผ่านใหม่</label>
                <input type="password" id="id_new_password1" name="new_password1" required
                    class="w-full mt-2 p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-transparent">
            </div>

            <!-- ฟิลด์ยืนยันรหัสผ่าน -->
            <div>
                <label for="id_new_password2" class="block text-lg font-medium text-gray-700">ยืนยันรหัสผ่านใหม่</label>
                <input type="password" id="id_new_password2" name="new_password2" required
                    class="w-full mt-2 p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-transparent">
            </div>

            <!-- ปุ่มส่งข้อมูล -->
            <button type="submit"
                class="w-full bg-yellow-500 text-white text-lg font-semibold py-3 rounded-lg shadow-lg hover:bg-yellow-600 transition">
                รีเซ็ตรหัสผ่าน
            </button>
        </form>

        <!-- ลิงก์กลับไปหน้า Login -->
        <div class="mt-6 text-center">
            <a href="{% url 'login' %}" class="text-gray-600 hover:underline">กลับไปยังหน้าเข้าสู่ระบบ</a>
        </div>
    </div>

</body>
</html>
