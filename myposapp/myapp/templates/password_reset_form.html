{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% tailwind_css %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset - Cafe POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    
    <div class="flex bg-white shadow-xl rounded-lg overflow-hidden w-full max-w-5xl min-h-[70vh]">
        
        <!-- Left Section (Image) -->
        <div class="hidden md:block md:w-full bg-cover bg-center" style="background-image: url('{% static 'BG_login.png' %}');"></div>
        
        <!-- Right Section (Form) -->
        <div class="w-full md:w-full p-8">
            <h2 class="text-3xl font-bold text-gray-800 text-center">รีเซ็ตรหัสผ่าน</h2>
            <p class="text-gray-600 text-center mb-6">กรุณาป้อนอีเมลของคุณเพื่อรับลิงก์รีเซ็ต</p>
            
            <!-- Password Reset Form -->
            <form method="post" class="space-y-4">
                {% csrf_token %}
                
                <div>
                    <label for="email" class="block text-gray-700 font-medium">อีเมล</label>
                    <input type="email" id="email" name="email" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-400 focus:outline-none" placeholder="ป้อนอีเมลของคุณ" required>
                </div>

                <button type="submit" class="w-full bg-yellow-500 text-white py-3 rounded-lg text-lg font-semibold hover:bg-yellow-600 transition">
                    ส่งลิงก์รีเซ็ต
                </button>
            </form>

            <!-- Error Messages -->
            {% if messages %}
            <ul class="mt-4 text-center">
                {% for message in messages %}
                <li class="{% if message.tags == 'success' %}text-green-500{% else %}text-red-500{% endif %}">
                    {{ message }}
                </li>
                {% endfor %}
            </ul>
            {% endif %}

            <!-- Back to Login -->
            <p class="text-gray-600 text-center mt-4">
                <a href="{% url 'login' %}" class="text-yellow-500 font-medium hover:underline">กลับไปยังหน้าเข้าสู่ระบบ</a>
            </p>
        </div>
    </div>

</body>
</html>
