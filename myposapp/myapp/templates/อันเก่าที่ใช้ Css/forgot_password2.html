{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% tailwind_css %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
        }
        .reset-password-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }
        .reset-password-form {
            display: flex;
            justify-content: space-between;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 80%;
            max-width: 1200px;
            min-height: 70vh;
        }
        .reset-password-left {
            flex: 1;
            background: url("{% static 'BG_login.png' %}") no-repeat center center;
            background-size: cover;
            position: relative;
        }
        .reset-password-left::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }
        .reset-password-right {
            flex: 1.5;
            padding: 40px 60px;
        }
        .reset-password-form h2 {
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #7c6e6e;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #7c6e6e;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #4f46e5;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 0;
            background-color: #d4af37;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #c9a01b;
        }
        .link {
            text-align: center;
            margin-top: 10px;
        }
        .link a {
            color: #7c6e6e;
            text-decoration: none;
            font-weight: 500;
        }
        .link a:hover {
            text-decoration: underline;
        }
        .messages {
            margin-top: 50px;
        }
    </style>
</head>
<body>
<div class="reset-password-container">
    <div class="reset-password-form">
        <div class="reset-password-left"></div>
        <div class="reset-password-right">
            <h2>Reset Password</h2>
            <p class="text-center text-gray-600 mb-6">Enter and confirm your new password.</p>
            <form method="post" action="{% url 'reset_password' %}">
                {% csrf_token %}
                <input type="hidden" name="email" value="{{ email }}">
                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <input type="password" id="new_password" name="new_password" placeholder="Enter new password" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required>
                </div>
                <button type="submit" class="btn">Update Password</button>
            </form>
            <div class="messages">
                {% if messages %}
                <ul>
                    {% for message in messages %}
                    <li class="{% if message.tags == 'success' %}text-green-500{% else %}text-red-500{% endif %}">{{ message }}</li>
                    {% endfor %}
                </ul>
                {% endif %}
            </div>
        </div>
    </div>
</div>
</body>
</html>
