{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% tailwind_css %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รีเซ็ตรหัสผ่านเสร็จสมบูรณ์</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white shadow-lg rounded-lg p-8 max-w-md w-full text-center">
        <h2 class="text-3xl font-bold text-gray-800">รีเซ็ตรหัสผ่านสำเร็จ!</h2>
        <p class="text-gray-600 mt-2 mb-6">รหัสผ่านของคุณถูกเปลี่ยนแล้ว คุณสามารถเข้าสู่ระบบด้วยรหัสผ่านใหม่</p>

        <!-- ปุ่มกลับไปล็อกอิน -->
        <a href="{% url 'login' %}"
            class="inline-block w-full bg-yellow-500 text-white text-lg py-3 rounded-lg shadow-lg hover:bg-yellow-600 transition">
            กลับไปยังหน้าเข้าสู่ระบบ
        </a>
    </div>

</body>
</html>
