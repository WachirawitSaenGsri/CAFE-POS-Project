{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% tailwind_css %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        .reset-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .reset-form {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 40px 60px;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        .reset-form h2 {
            font-size: 36px;
            font-weight: 600;
            color: #7c6e6e;
            margin-bottom: 20px;
        }
        .reset-form p {
            font-size: 18px;
            color: #7c6e6e;
            margin-bottom: 20px;
        }
        .reset-form a {
            font-size: 16px;
            color: #d4af37;
            text-decoration: none;
            font-weight: 600;
        }
        .reset-form a:hover {
            color: #c9a01b;
        }
    </style>
</head>
<body>

<div class="reset-container">
    <div class="reset-form">
        <h2>รีเซ็ตรหัสผ่านเสร็จสมบูรณ์</h2>
        <p>รหัสผ่านของคุณถูกรีเซ็ตเรียบร้อยแล้ว ตอนนี้คุณสามารถเข้าสู่ระบบด้วยรหัสผ่านใหม่ของคุณ</p>
        <a href="{% url 'login' %}" class="btn-back">กลับไปยังหน้าเข้าสู่ระบบ</a>
    </div>
</div>

</body>
</html>
