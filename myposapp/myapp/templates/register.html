{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% tailwind_css %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Cafe POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    
    <div class="flex flex-col md:flex-row bg-white rounded-lg shadow-lg overflow-hidden max-w-5xl w-full">
        
        <!-- Left Section (Image) -->
        <div class="hidden md:block md:w-1/2 bg-cover bg-center" style="background-image: url('{% static 'BG_login.png' %}');"></div>
        
        <!-- Right Section (Form) -->
        <div class="w-full md:w-1/2 p-8">
            <h2 class="text-3xl font-bold text-gray-800 text-center">สมัครสมาชิก</h2>
            <p class="text-gray-600 text-center mb-6">สร้างบัญชีใหม่เพื่อเริ่มต้นใช้งาน</p>
            
            <!-- Register Form -->
            <form method="post" class="space-y-4">
                {% csrf_token %}
                
                <div>
                    <label for="username" class="block text-gray-700 font-medium">Username</label>
                    <input type="text" id="username" name="username" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-400 focus:outline-none" placeholder="Enter your username" required>
                </div>

                <div>
                    <label for="store_name" class="block text-gray-700 font-medium">Store Name</label>
                    <input type="text" id="store_name" name="store_name" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-400 focus:outline-none" placeholder="Enter your store name" required>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="firstname" class="block text-gray-700 font-medium">First Name</label>
                        <input type="text" id="firstname" name="firstname" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-400 focus:outline-none" placeholder="First name" required>
                    </div>
                    <div>
                        <label for="lastname" class="block text-gray-700 font-medium">Last Name</label>
                        <input type="text" id="lastname" name="lastname" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-400 focus:outline-none" placeholder="Last name" required>
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-gray-700 font-medium">Email</label>
                    <input type="email" id="email" name="email" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-400 focus:outline-none" placeholder="Enter your email" required>
                </div>

                <div>
                    <label for="password" class="block text-gray-700 font-medium">Password</label>
                    <input type="password" id="password" name="password" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-400 focus:outline-none" placeholder="Enter your password" required>
                </div>

                <div>
                    <label for="confirm_password" class="block text-gray-700 font-medium">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-400 focus:outline-none" placeholder="Confirm your password" required>
                </div>

                <button type="submit" class="w-full bg-yellow-500 text-white py-3 rounded-lg text-lg hover:bg-yellow-600 transition">
                    สมัครสมาชิก
                </button>
            </form>

            <!-- Error Messages -->
            {% if messages %}
            <ul class="mt-4 text-center">
                {% for message in messages %}
                <li class="{% if message.tags == 'success' %}text-green-500{% else %}text-red-500{% endif %}">
                    {{ message }}
                </li>
                {% endfor %}
            </ul>
            {% endif %}

            <!-- Login Link -->
            <p class="text-gray-600 text-center mt-4">
                มีบัญชีอยู่แล้ว? 
                <a href="{% url 'login' %}" class="text-yellow-500 font-medium hover:underline">เข้าสู่ระบบ</a>
            </p>
        </div>
    </div>

</body>
</html>
