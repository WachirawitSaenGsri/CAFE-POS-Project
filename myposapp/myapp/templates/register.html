{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% tailwind_css %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Cafe POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
        }
        .form-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }
        .form-wrapper {
            display: flex;
            justify-content: space-between;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 80%;
            max-width: 1200px;
            min-height: 70vh;
        }
        .form-left {
            flex: 1;
            background: url("{% static 'BG_login.png' %}") no-repeat center center;
            background-size: cover;
            position: relative;
        }
        .form-left::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }
        .form-right {
            flex: 1.5;
            padding: 40px 60px;
        }
        .form-wrapper h2 {
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #7c6e6e;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #7c6e6e;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #4f46e5;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 0;
            background-color: #d4af37;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #c9a01b;
        }
        .link {
            text-align: center;
            margin-top: 10px;
        }
        .link a {
            color: #7c6e6e;
            text-decoration: none;
            font-weight: 500;
        }
        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="form-container">
    <div class="form-wrapper">
        <div class="form-left"></div>
        <div class="form-right">
            <h2>Register</h2>
            <p class="text-center text-gray-600 mb-6">สร้างบัญชีใหม่</p>
            <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>
                <div class="form-group">
                <label for="store_name">Store Name</label>
                <input type="text" id="store_name" name="store_name" placeholder="Store Name" required>
            </div>
                <div class="form-group">
                <label for="firstname">First Name</label>
                <input type="text" id="firstname" name="firstname" placeholder="First Name" required>
            </div>
            <div class="form-group">
                <label for="lastname">Last Name</label>
                <input type="text" id="lastname" name="lastname" placeholder="Last Name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
            </div>
            <button type="submit" class="btn">สมัครสมาชิก</button>
        </form>
            <div class="link mt-6">
                <a href="{% url 'login' %}">กลับไปยังหน้าเข้าสู่ระบบ</a>
                    {% if messages %}
    <ul>
        {% for message in messages %}
            <li class="{% if message.tags == 'success' %}text-green-500{% else %}text-red-500{% endif %}">{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
            </div>
        </div>
    </div>
</div>
</body>
</html>
